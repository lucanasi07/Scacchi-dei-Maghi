<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scacchi dei Maghi ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars"></div>

    <div id="app">
        <header>
            <h1>⚡ Scacchi dei Maghi ⚡</h1>
            <p class="sub">Hogwarts Wizard Chess</p>
        </header>

        <div id="layout">

            <!-- Left -->
            <div class="panel" id="lpanel">
                <div class="pcard" id="bcard">
                    <div class="ptitle"><span class="picon">🧙</span>Forze Oscure</div>
                    <div class="caps" id="bcaps"></div>
                </div>
                <div class="logbox">
                    <div class="logtitle">📜 Cronaca della Battaglia</div>
                    <div id="blog"></div>
                </div>
            </div>

            <!-- Center -->
            <div id="center">
                <div id="board"></div>
                <div id="statusbar">
                    <div id="turndsp">⚔️ Turno del Bianco</div>
                    <div id="chkdsp"></div>
                </div>
            </div>

            <!-- Right -->
            <div class="panel" id="rpanel">
                <div class="pcard" id="wcard">
                    <div class="ptitle"><span class="picon">🧙‍♀️</span>Forze della Luce</div>
                    <div class="caps" id="wcaps"></div>
                </div>
                <div id="ctrl">
                    <button onclick="newGame()">🔄 Nuova Partita</button>
                    <button onclick="undoMove()">↩️ Annulla Mossa</button>
                </div>
                <div class="logbox">
                    <div class="logtitle">📋 Cronologia Mosse</div>
                    <div id="mhist"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Promotion Modal -->
    <div id="prmodal" class="modal hidden">
        <div class="mdlbox">
            <h2>✨ Promuovi il Pedone!</h2>
            <p>Scegli il nuovo pezzo:</p>
            <div id="prchoices"></div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gomodal" class="modal hidden">
        <div class="mdlbox">
            <div id="gomagic">✨</div>
            <h2 id="gotitle"></h2>
            <p  id="gomsg"></p>
            <button onclick="newGame()">🔄 Gioca Ancora</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
